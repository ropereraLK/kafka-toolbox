
services:
  zookeeper:
    image: zookeeper:${ZOOKEEPER_VERSION}
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka1
    depends_on:
      - zookeeper
    ports:
      - "${BROKER1_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: ${BROKER1_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${BROKER1_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${REPLICATION_FACTOR}

  kafka2:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka2
    depends_on:
      - zookeeper
    ports:
      - "${BROKER2_PORT}:9093"
    environment:
      KAFKA_BROKER_ID: ${BROKER2_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${BROKER2_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${REPLICATION_FACTOR}

  kafka3:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka3
    depends_on:
      - zookeeper
    ports:
      - "${BROKER3_PORT}:9094"
    environment:
      KAFKA_BROKER_ID: ${BROKER3_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${BROKER3_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${REPLICATION_FACTOR}

